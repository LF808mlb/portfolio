name: CI

on:
  push:
  pull_request:

jobs:
  build-lint-format:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check
